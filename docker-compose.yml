version: "3.8"

# Project Unit42-FirmwareX — Docker Compose Orchestration
# Palo Alto Networks // Unit 42 Threat Research & Security Engineering

services:
  firmwarex-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    container_name: firmwarex-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FIRMWAREX_API_HOST=0.0.0.0
      - FIRMWAREX_API_PORT=8000
      - FIRMWAREX_SANDBOX_TIMEOUT_SECONDS=120
      - FIRMWAREX_MAX_MEMORY_BYTES=536870912
      - FIRMWAREX_NETWORK_EGRESS_DENIED=true
    volumes:
      - firmwarex_storage:/app/data_storage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - firmwarex-internal

  firmwarex-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["dashboard"]
    container_name: firmwarex-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - firmwarex_storage:/app/data_storage
    depends_on:
      - firmwarex-api
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - firmwarex-internal

  redis:
    image: redis:7-alpine
    container_name: firmwarex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - firmwarex-internal

volumes:
  firmwarex_storage:
    driver: local
  redis_data:
    driver: local

networks:
  firmwarex-internal:
    driver: bridge
